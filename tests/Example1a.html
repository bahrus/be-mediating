<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- #include virtual="/imports.html" -->
    <title>Example 1a</title>
    <script type=module>
        import 'xtal-element/index.js';
        import '/🕊️.js';
    </script>
</head>
<body>
    <mood-stone>
        <div id=test itemprop=isCheerful></div>
        <xtal-element infer-props></xtal-element>
    </mood-stone>
    <input id=isHappy name=isHappy type="checkbox">
    <div id=target></div>
    <script
        🕊️="@isHappy::input to mood-stone" 
        onchange="event.r = {isCheerful: event.$.checked}">
    </script>

<script>
    function runTest() {
        isHappy.click();
        setTimeout(() => {
            if(test.textContent === 'true'){
                target.setAttribute('mark', 'good');
            }
        }, 100);
    }
    setTimeout(() => {
        runTest();
    }, 1000);
</script>
</body>
</html>
